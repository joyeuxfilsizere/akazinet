name: FTP map (temp diagnostic 2)

on:
  workflow_dispatch:

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Map layout
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          port="${FTP_PORT:-21}"
          echo "===== ls home root . ====="
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER:$port" -e "set ftp:ssl-allow yes; set ftp:ssl-force no; set ssl:verify-certificate no; set net:timeout 45; ls -la .; bye" 2>&1 | head -80
          echo "===== find opcache_reset.php (maxdepth 3) ====="
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER:$port" -e "set ftp:ssl-allow yes; set ftp:ssl-force no; set ssl:verify-certificate no; set net:timeout 45; find -maxdepth 3 .; bye" 2>&1 | grep -iE "opcache_reset" || echo "(none found)"
          echo "===== ls akazinet.com (head) ====="
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER:$port" -e "set ftp:ssl-allow yes; set ftp:ssl-force no; set ssl:verify-certificate no; set net:timeout 45; ls -la akazinet.com; bye" 2>&1 | head -40